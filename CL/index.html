<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>报告防伪查询</title>
<style>
:root{--blue:#0879d1;--deep:#0569bd;--text:#1f2937;--muted:#64748b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:linear-gradient(180deg,var(--blue) 0 235px,#f4f7fb 235px 100%);color:var(--text)}
.page{min-height:100svh;padding-bottom:28px}
.header{height:112px;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px 18px 34px;font-size:clamp(24px,7vw,32px);font-weight:700;letter-spacing:3px}
.card{width:min(92vw,720px);margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 5px 22px rgba(0,53,110,.18);padding:20px 18px 24px}
.card-title{font-size:18px;font-weight:700;color:var(--deep);padding:0 0 14px;border-bottom:1px solid #e5edf6;margin-bottom:6px}
.report{width:100%;border-collapse:collapse;table-layout:fixed}
.report th,.report td{padding:10px 2px;line-height:1.55;vertical-align:top;word-break:break-all}
.report th{width:27%;text-align:left;color:#526273;font-weight:600}
.report td{width:73%;color:#202b38}
.actions{text-align:center;padding:15px 0 5px}
.actions button{border:0;border-radius:7px;background:var(--blue);color:#fff;font-size:16px;padding:10px 30px;box-shadow:0 3px 8px rgba(8,121,209,.25);cursor:pointer}
.actions button:active{background:var(--deep)}
.support{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
@media (max-width:380px){.card{width:94vw;padding:16px 13px}.report th,.report td{padding:8px 1px;font-size:14px}.header{letter-spacing:1px}}
</style>
</head>
<body>
<main class="page">
<header class="header">报告防伪查询</header>
<section class="card" aria-label="报告信息">
<div class="card-title">检验报告信息</div>
<table class="report">
<tr><th>设备名称</th><td>所有的内容都可以修改</td></tr>
<tr><th>制造单位</th><td>淄博正翔封头制造有限公司</td></tr>
<tr><th>设备类别</th><td>压力容器受压元件、受压部件</td></tr>
<tr><th>产品编号</th><td>B2610-79-1~4</td></tr>
<tr><th>设备型号</th><td>EHA3000×14(12.6)</td></tr>
<tr><th>检验人员</th><td>李刚</td></tr>
<tr><th>检验类型</th><td>制造监检</td></tr>
<tr><th>报告编号</th><td>ZBFTJ20260007-119</td></tr>
<tr><th>检验日期</th><td>2026-11-05</td></tr>
<tr><th>防伪码</th><td>837677e2dc024a7442b240aba7ca9ec2</td></tr>
<tr><th>检验单位</th><td>淄博市特种设备检验研究院</td></tr>
</table>
<div class="actions"><button type="button" onclick="location.href='image-viewer.html'">报告预览</button></div>
<div class="support">技术支持：山东乐习信息科技有限公司</div>
</section>
</main>
</body>
</html>
