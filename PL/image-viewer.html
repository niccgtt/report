<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>报告预览</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#525659;font-family:Arial,"Microsoft YaHei",sans-serif;color:#fff}.bar{height:52px;background:#323639;display:flex;align-items:center;gap:10px;padding:0 12px;box-shadow:0 1px 4px #222}.bar button{border:0;background:#474b4f;color:#fff;border-radius:3px;height:32px;min-width:34px;font-size:16px}.info{font-size:14px}.tools{margin-left:auto;display:flex;gap:6px}.stage{height:calc(100% - 52px);overflow:auto;padding:24px 12px;text-align:center}.paper{display:inline-block;line-height:0;box-shadow:0 2px 8px #222;background:#fff;transform-origin:top center}.paper img{display:block;max-width:none;width:auto;height:auto}.status{position:fixed;bottom:0;left:0;right:0;text-align:center;color:#ddd;font-size:12px;padding:4px;pointer-events:none}@media(max-width:600px){.bar{height:48px;padding:0 6px;gap:5px}.bar button{height:30px;min-width:30px}.stage{height:calc(100% - 48px);padding:12px 4px}}</style></head><body><div class="bar"><button id="back">‹</button><span class="info">1 / 1</span><div class="tools"><button id="minus">−</button><button id="plus">＋</button><button id="page">整页</button><button id="width">宽度</button></div></div><div class="stage" id="stage"><div class="paper" id="paper"><img id="img" src="report-page.webp" alt="报告页面" decoding="async" fetchpriority="high"></div></div><div class="status" id="status">正在加载报告…</div><script>const stage=document.getElementById('stage'),paper=document.getElementById('paper'),img=document.getElementById('img'),status=document.getElementById('status');let mode='page',scale=1;function fit(){if(!img.naturalWidth)return;const sw=stage.clientWidth-28,sh=stage.clientHeight-28;const s=mode==='page'?Math.min(sw/img.naturalWidth,sh/img.naturalHeight):sw/img.naturalWidth;scale=Math.max(.05,s);img.style.width=(img.naturalWidth*scale)+'px';img.style.height=(img.naturalHeight*scale)+'px';status.textContent=mode==='page'?'整页显示':'宽度适配'}img.onload=fit;document.getElementById('back').onclick=()=>history.back();document.getElementById('minus').onclick=()=>{mode='custom';scale=Math.max(.1,scale-.1);img.style.width=img.naturalWidth*scale+'px';img.style.height=img.naturalHeight*scale+'px'};document.getElementById('plus').onclick=()=>{mode='custom';scale=Math.min(4,scale+.1);img.style.width=img.naturalWidth*scale+'px';img.style.height=img.naturalHeight*scale+'px'};document.getElementById('page').onclick=()=>{mode='page';fit()};document.getElementById('width').onclick=()=>{mode='width';fit()};window.addEventListener('resize',()=>mode!=='custom'&&fit());</script></body></html>
