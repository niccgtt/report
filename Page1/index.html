<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:#272431;color:#2d2932}
body{min-height:100vh;display:flex;justify-content:center}.phone-page{width:min(100%,720px);min-height:100vh;background:linear-gradient(180deg,#f6eaf0 0,#fff8fa 35%,#eee8ed 100%);display:flex;flex-direction:column;box-shadow:0 0 32px #17141d80}.top{height:76px;background:linear-gradient(100deg,#f5e6ef,#fff8fb);display:flex;align-items:center;justify-content:space-between;padding:12px 18px 8px;border-bottom:1px solid #eee1e7}.close{font-size:35px;font-weight:200;color:#5b5660;line-height:1}.brand{text-align:center;flex:1}.brand h1{font-size:26px;font-weight:500;margin:0;letter-spacing:.3px}.brand p{font-size:12px;color:#706873;margin:2px 0 0}.more{font-size:28px;letter-spacing:2px;color:#6b6570}.toolbar{height:53px;background:linear-gradient(90deg,#514956,#37323f);color:#fff;display:flex;align-items:center;padding:0 20px;gap:22px;box-shadow:0 2px 5px #0004}.tool{font-size:26px;opacity:.9}.pages{margin-left:5px;background:#645c68;border-radius:2px;padding:5px 12px;font-size:16px}.zoom{margin-left:auto;font-size:25px}.qr-title{margin:22px 20px 8px;text-align:center;font-size:22px;font-weight:600;color:#4a4047}.subtitle{text-align:center;margin:0 20px 16px;color:#80727a;font-size:14px}.report{position:relative;margin:0 20px 20px;background:#fffafc;min-height:430px;border:1px solid #e1d5dc;box-shadow:0 4px 16px #40324422;padding:24px 22px 28px;overflow:hidden}.report:before{content:"技术支持  技术支持  技术支持";position:absolute;inset:135px -60px auto -60px;transform:rotate(-24deg);font-size:38px;letter-spacing:10px;color:#d8cbd2;opacity:.24;white-space:nowrap}.qr{position:absolute;left:24px;top:22px;width:72px;height:72px;image-rendering:auto}.report h2{text-align:center;font-size:23px;margin:0 0 16px;position:relative}.report .line{height:1px;background:#b8aab3;margin:10px 0 18px}.info{position:relative;border:1px solid #cfc1ca;font-size:14px;line-height:1.9}.row{display:flex;border-bottom:1px solid #d8ccd2}.row:last-child{border-bottom:0}.label{width:30%;padding:6px 8px;background:#f8f2f5;border-right:1px solid #d8ccd2;color:#665b64}.value{flex:1;padding:6px 8px}.seal{position:relative;text-align:center;margin:24px auto 12px;border:2px solid #ad3e45;color:#b43a43;border-radius:50%;width:86px;height:86px;display:grid;place-items:center;font-size:15px;transform:rotate(-12deg)}.seal:after{content:"★";font-size:28px}.note{position:relative;text-align:center;color:#887b83;font-size:12px;margin-top:15px}.bottom{margin-top:auto;padding:14px 20px 26px;background:#fff5f8;border-top:1px solid #eadde3}.preview{display:block;width:100%;border:0;border-radius:6px;background:#b9323d;color:#fff;font-size:18px;font-weight:600;padding:15px;box-shadow:0 4px 10px #9e263533;cursor:pointer;text-align:center;text-decoration:none}.preview:active{transform:translateY(1px)}.support{text-align:center;font-size:12px;color:#897b84;margin:11px 0 0}

<main class="phone-page">
