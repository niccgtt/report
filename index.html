<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>欢迎来到我的网站</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #eef5ff, #ffffff 55%, #f3efff);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    .page { width: min(100%, 920px); text-align: center; }
    h1 { margin: 0 0 18px; color: #172554; font-size: clamp(28px, 5vw, 52px); }
    .subtitle { margin: 0 0 24px; color: #64748b; font-size: 16px; }
    .image-card {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 18px 55px rgba(30, 64, 175, .18);
    }
    .image-card img { display: block; width: 100%; height: auto; }
    .confirm {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      border: 0;
      border-radius: 999px;
      padding: 13px 34px;
      color: #fff;
      background: #2563eb;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(37, 99, 235, .38);
    }
    .confirm:hover { background: #1d4ed8; }
    .confirm:focus-visible { outline: 4px solid #bfdbfe; outline-offset: 3px; }
    .hint { margin-top: 16px; color: #64748b; font-size: 14px; }
  </style>
</head>
<body>
  <main class="page">
    <h1>欢迎来到我的网站</h1>
    <p class="subtitle">点击图片上的“确定”按钮，查看下一张图片</p>
    <section class="image-card">
      <img id="mainImage" src="welcome.jpg" alt="欢迎图片">
      <button id="confirmButton" class="confirm" type="button">确定</button>
    </section>
    <p class="hint" id="hint">这是首页欢迎图片</p>
  </main>
  <script>
    const image = document.getElementById('mainImage');
    const button = document.getElementById('confirmButton');
    const hint = document.getElementById('hint');
    button.addEventListener('click', () => {
      image.src = 'second.jpg';
      image.alt = 'AI员工组织架构图片';
      button.textContent = '已确定';
      button.disabled = true;
      button.style.cursor = 'default';
      button.style.background = '#16a34a';
      hint.textContent = '已切换到第二张图片';
    });
  </script>
</body>
</html>
